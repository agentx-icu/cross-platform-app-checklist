name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/check_skill.py
