name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/check_skill.py
      - run: python3 tools/evaluate_review.py --examples
      - name: Regrade saved reports (does not run agents)
        run: |
          python3 tools/evaluate_review.py flutter-change evals/results/flutter-change.json
          python3 tools/evaluate_review.py electron-change evals/results/electron-change.json
          python3 tools/evaluate_review.py release-review evals/results/release-review.json
      - run: git show --format= --check HEAD
